name: Feature request
description: Suggest something Zearch should do.
labels: ["type/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: Describe the behavior, not only the UI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Retrieval and sources
        - Jev selection and verification
        - App interface
        - Accounts and billing
        - API
        - Infrastructure
        - Not sure
